# All tunable knobs live here. Nothing in src/ should hard-code thresholds.

data:
  raw_dir: data/raw          # contains train/, validation/, test/ (organiser folders or symlinks)
  sample_dir: data/sample    # synthetic mini-splits in the same format (for tests)

submission:
  id_col: TRANSACTION_HASH
  score_col: score
  float_format: "%.8f"

cv:
  n_splits: 5
  repeats: 3                 # repeated grouped CV with seeds SEED, SEED+1, ...
  group_col: meta_scenario_id  # txs of one scenario never split across folds
  metric: average_precision  # site score = 100 x AP
  top_frac: 0.01             # site also shows precision/recall in the top 1%

features:
  round_levels: [10, 100, 1000]   # on delivered units (amount_out)
  account_windows_secs:
    1h: 3600
    24h: 86400
    72h: 259200

rules:
  structuring:
    threshold: 1000          # USD. TODO(P5): set from EDA; just-below-threshold bursts
    margin: 0.15
    min_count: 4
    window_secs: 86400
  passthrough:
    forward_ratio: 0.8       # receiver forwards >= 80% of the value ...
    window_secs: 3600        # ... within W
  round_amount:
    level: 100
  velocity_burst:
    short_secs: 3600
    long_secs: 86400
    min_count: 5
    rate_ratio: 4.0
  weights:                   # rule_score = weighted mean of the flags
    rule_structuring: 1.0
    rule_passthrough: 1.0
    rule_round_amount: 0.25
    rule_velocity_burst: 0.5

models:
  lgbm:                      # regularised on purpose: small trees, subsampling
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_lambda: 5.0
    deterministic: true
    force_row_wise: true
    verbose: -1
  iforest:
    n_estimators: 300
    max_samples: auto
    contamination: auto

ensemble:
  supervised:
    lgbm: 1.0
    iforest: 0.0
    rules: 0.0
  unsupervised:
    iforest: 0.5
    rules: 0.5

n_jobs: 1                    # keep 1 for the final, reproducible run
